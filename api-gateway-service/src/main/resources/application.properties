spring.application.name=api-gateway-service
spring.config.import=optional:configserver:http://${CONFIG_SERVER_URL:localhost}:4542


#eureka.instance.hostname=${HOSTNAME:localhost}.eureka
eureka.instance.hostname=eureka-0
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}
eureka.client.serviceUrl.defaultZone=http://eureka-0.eureka.default.svc.cluster.local:8761/eureka


server.port=4544
#eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}

#management.tracing.sampling.probability=1.0

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway.route.RouteDefinition.Locator=INFO
logging.level.org.springframework.cloud.gateway=TRACE

spring.cloud.gateway.routes[0].id=movie-calling-service
spring.cloud.gateway.routes[0].uri=lb://movie-calling-service
#spring.cloud.gateway.routes[0].uri=http://movie-calling-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/catalog/**

spring.cloud.gateway.routes[1].id=movie-info-service
spring.cloud.gateway.routes[1].uri=lb://movie-info-service
#spring.cloud.gateway.routes[1].uri=http://movie-info-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/movies/**

spring.cloud.gateway.routes[2].id=rating-data-service
spring.cloud.gateway.routes[2].uri=lb://rating-data-service
#spring.cloud.gateway.routes[2].uri=http://rating-data-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/ratingsdata/**

spring.cloud.gateway.routes[3].id=dept-service
spring.cloud.gateway.routes[3].uri=lb://dept-service
#spring.cloud.gateway.routes[3].uri=http://rating-data-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/departments/**

spring.cloud.gateway.routes[4].id=user-service
spring.cloud.gateway.routes[4].uri=lb://user-service
#spring.cloud.gateway.routes[4].uri=http://rating-data-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/users/**
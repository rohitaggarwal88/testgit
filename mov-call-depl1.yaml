apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-calling-service-app
spec:
  selector:
    matchLabels:
      app: movie-calling-service-app
  template:
    metadata:
      labels:
        app: movie-calling-service-app
    spec:
      containers:
      - name: movie-calling-service-app
        image: rohitaggarwal88/movie-calling-service:0.0.4-SNAPSHOT
        imagePullPolicy: Always
        ports:
        - containerPort: 4545

---

apiVersion: v1
kind: Service
metadata:
  name: movie-calling-service-svc
spec:
  selector:
    app: movie-calling-service-app
  ports:
  - port: 80
    targetPort: 4545
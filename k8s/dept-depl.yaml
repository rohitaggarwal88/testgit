apiVersion: apps/v1
kind: Deployment
metadata:
  name: dept-service-app
  labels:
    app: dept-service-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dept-service-app
  template:
    metadata:
      labels:
        app: dept-service-app
    spec:
      containers:
        - name: dept-service-app
          image: rohitaggarwal88/department-service:0.0.2-SNAPSHOT
          imagePullPolicy: Always
          ports:
            - containerPort: 6001

---
apiVersion: v1
kind: Service
metadata:
  name: dept-service-svc
spec:
  ports:
    - targetPort: 6001
      port: 80
  selector:
    app: dept-service-app
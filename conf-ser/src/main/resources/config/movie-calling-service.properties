server.port=4545
#eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}
#for zipkin
#management.tracing.sampling.probability=1.0

#Actuator configuration
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

#Resilinece4j Properties
resilience4j.circuitbreaker.instances.inventory.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.inventory.eventConsumerBufferSize=10
resilience4j.circuitbreaker.instances.inventory.failureRateThreshold=50
resilience4j.circuitbreaker.instances.inventory.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.inventory.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.inventory.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.inventory.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.inventory.slidingWindowSize=5
resilience4j.circuitbreaker.instances.inventory.slidingWindowType=COUNT_BASED

# Retry properties
resilience4j.retry.instances.inventory.registerHealthIndicator=true
resilience4j.retry.instances.inventory.maxRetryAttempts=5
resilience4j.retry.instances.inventory.waitDuration=10s

# Rate Limiter properties
resilience4j.ratelimiter.instances.inventory.registerHealthIndicator=false
resilience4j.ratelimiter.instances.inventory.limitForPeriod=10
resilience4j.ratelimiter.instances.inventory.limitRefreshPeriod=10s
resilience4j.ratelimiter.instances.inventory.timeoutDuration=1s

# bulkhead properties
resilience4j.bulkhead.instances.inventory.maxWaitDuration=20s
resilience4j.bulkhead.instances.inventory.maxConcurrentCalls=10

# bulkhead properties
resilience4j.thread-pool-bulkhead.instances.inventory.maxThreadPoolSize=1
resilience4j.thread-pool-bulkhead.instances.inventory.coreThreadPoolSize=1
resilience4j.thread-pool-bulkhead.instances.inventory.queueCapacity=1
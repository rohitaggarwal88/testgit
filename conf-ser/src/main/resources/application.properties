spring.application.name=conf-ser
server.port=4542
spring.profiles.active=native
#eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}
spring.cloud.config.server.git.uri=https://github.com/rohitaggarwal88/confi-serve
spring.cloud.config.server.git.clone-on-start=true

#eureka.instance.hostname=${HOSTNAME:localhost}.eureka
eureka.instance.hostname=eureka-0
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
#eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_ADDRESS:http://localhost:8761/eureka}
eureka.client.serviceUrl.defaultZone=http://eureka-0.eureka.default.svc.cluster.local:8761/eureka